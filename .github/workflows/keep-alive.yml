name: Pancingan Anti Suspend

on:
  schedule:
    # Jalan setiap jam 8 pagi dan 8 malam (WIB itu UTC+7, jadi sesuaikan kalau mau jam lain)
    # Format cron di sini pakai UTC. Jam 13:00 UTC = Jam 20:00 WIB.
    - cron: '0 0,3,6,9,12,15,18,21 * * *' 
  workflow_dispatch: # Biar bisa ditest run manual

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3

      - name: Update repo biar Choreo kaget
        run: |
          git config --global user.name "Satpam Bot"
          git config --global user.email "satpam@bot.com"
          git commit --allow-empty -m "Jurus pancingan re-deploy otomatis"
          git push
